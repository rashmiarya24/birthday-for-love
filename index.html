<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  font-family:'Inter',sans-serif;
  background: radial-gradient(circle at top,#2c5364,#0f2027,#000);
  color:#fff;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Balloons */
.balloon{
  position:absolute;
  bottom:-150px;
  width:55px;
  height:75px;
  border-radius:50%;
  animation:float 10s linear infinite;
}
.balloon::after{
  content:'';
  position:absolute;
  width:2px;
  height:60px;
  background:#fff;
  left:50%;
  top:75px;
}
.b1{left:8%;background:#ff6f91}
.b2{left:28%;background:#ffc75f;animation-delay:2s}
.b3{left:55%;background:#845ec2;animation-delay:4s}
.b4{left:78%;background:#4d96ff;animation-delay:1s}

@keyframes float{
  to{transform:translateY(-120vh)}
}

/* Card */
.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(14px);
  border-radius:24px;
  padding:35px 25px;
  width:90%;
  max-width:420px;
  text-align:center;
  box-shadow:0 0 45px rgba(255,215,150,0.3);
  animation:heartbeat 3s infinite;
}

@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.02)}
}

h1{
  font-family:'Playfair Display',serif;
  font-size:2.1rem;
}

.message{
  font-size:1rem;
  line-height:1.6;
  margin:18px 0;
  animation:fadeIn 1.5s forwards;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

/* Cake */
.cake{
  margin:20px auto;
  width:140px;
}
.layer{
  background:#ffb703;
  height:35px;
  border-radius:10px;
  margin:4px 0;
}
.layer.middle{background:#fb8500}
.layer.top{background:#ffd166}

.candle{
  width:10px;
  height:35px;
  background:#fff;
  margin:0 auto;
  position:relative;
  border-radius:4px;
}
.flame{
  width:14px;
  height:22px;
  background:orange;
  position:absolute;
  top:-20px;
  left:-2px;
  border-radius:50%;
  animation:flicker .15s infinite;
}

@keyframes flicker{
  0%{transform:scale(1)}
  50%{transform:scale(0.9)}
  100%{transform:scale(1)}
}

/* Buttons */
.btn{
  margin-top:12px;
  padding:11px 18px;
  border:none;
  border-radius:25px;
  background:linear-gradient(135deg,#ffb347,#ffcc33);
  color:#000;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}
.btn:hover{transform:scale(1.1)}

.surprise{
  margin-top:12px;
  display:none;
  font-size:.95rem;
  color:#ffd6a5;
}

/* Confetti */
.confetti{
  position:absolute;
  width:8px;
  height:14px;
  top:-10px;
  animation:confetti 3s linear infinite;
}

@keyframes confetti{
  to{transform:translateY(110vh) rotate(360deg)}
}
</style>
</head>

<body>

<!-- Balloons -->
<div class="balloon b1"></div>
<div class="balloon b2"></div>
<div class="balloon b3"></div>
<div class="balloon b4"></div>

<div class="card">
  <h1>Happy Birthday ❤️</h1>

  <!-- Cake -->
  <div class="cake">
    <div class="candle">
      <div class="flame" id="flame"></div>
    </div>
    <div class="layer top"></div>
    <div class="layer middle"></div>
    <div class="layer"></div>
  </div>

  <p style="font-size:.9rem;opacity:.8;">Tap the cake to blow the candle 💨</p>

  <div class="message">
    To the man who makes life calmer, brighter, and better just by being in it ✨  
    <br><br>
    You are deeply loved, endlessly appreciated, and celebrated today — and always.
  </div>

  <button class="btn" onclick="popper()">🎉 Birthday Popper</button>
  <div class="surprise" id="surprise">
    I’m so lucky to walk life with you 💛  
    May this year bring smiles, success, and peace.
  </div>

  <button class="btn" onclick="love()">💖 Tap if you love me</button>
</div>

<script>
const flame=document.getElementById("flame");
document.querySelector(".cake").onclick=()=>{
  flame.style.display="none";
  popper();
};

function popper(){
  document.getElementById("surprise").style.display="block";
  for(let i=0;i<30;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},100%,60%)`;
    c.style.animationDuration=2+Math.random()*2+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}

function love(){
  alert("I love you more 😘 Happy Birthday!");
}
</script>

</body>
</html>
