<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  font-family:'Inter',sans-serif;
  background: radial-gradient(circle at top,#2c5364,#0f2027,#000);
  color:#fff;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Floating balloons */
.balloon{
  position:absolute;
  bottom:-150px;
  width:60px;
  height:80px;
  border-radius:50%;
  animation:float 10s linear infinite;
}
.balloon::after{
  content:'';
  position:absolute;
  width:2px;
  height:60px;
  background:#fff;
  left:50%;
  top:80px;
}
.b1{left:10%;background:#ff6f91;animation-delay:0s}
.b2{left:30%;background:#ffc75f;animation-delay:2s}
.b3{left:55%;background:#845ec2;animation-delay:4s}
.b4{left:75%;background:#4d96ff;animation-delay:1s}

@keyframes float{
  from{transform:translateY(0)}
  to{transform:translateY(-120vh)}
}

/* Card */
.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  border-radius:22px;
  padding:40px 30px;
  width:90%;
  max-width:420px;
  text-align:center;
  box-shadow:0 0 40px rgba(255,215,150,0.25);
  animation:heartbeat 3s infinite;
}

@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.015)}
}

h1{
  font-family:'Playfair Display',serif;
  font-size:2.2rem;
  margin-bottom:10px;
}

.message{
  font-size:1rem;
  line-height:1.6;
  margin:20px 0;
  opacity:0;
  animation:fadeIn 1.5s forwards;
  animation-delay:1s;
}

@keyframes fadeIn{
  to{opacity:1}
}

/* Buttons */
.btn{
  margin-top:15px;
  padding:12px 20px;
  border:none;
  border-radius:25px;
  background:linear-gradient(135deg,#ffb347,#ffcc33);
  color:#000;
  font-weight:600;
  cursor:pointer;
  transition:transform .2s;
}
.btn:hover{transform:scale(1.08)}

/* Hidden surprise text */
.surprise{
  margin-top:15px;
  display:none;
  font-size:0.95rem;
  color:#ffd6a5;
}

/* Confetti */
.confetti{
  position:absolute;
  width:8px;
  height:14px;
  background:red;
  top:-10px;
  animation:confetti 3s linear infinite;
}

@keyframes confetti{
  to{transform:translateY(110vh) rotate(360deg)}
}
</style>
</head>

<body>

<!-- Balloons -->
<div class="balloon b1"></div>
<div class="balloon b2"></div>
<div class="balloon b3"></div>
<div class="balloon b4"></div>

<!-- Card -->
<div class="card">
  <h1>Happy Birthday ❤️</h1>

  <div class="message">
    To the man who makes life calmer, brighter, and better just by being in it ✨  
    <br><br>
    You are deeply loved, endlessly appreciated, and celebrated today — and always.
  </div>

  <button class="btn" onclick="popper()">🎉 Tap for a Surprise</button>
  <div class="surprise" id="surprise">
    I’m so lucky to walk life with you 💛  
    May this year bring smiles, success, and peace.
  </div>

  <button class="btn" onclick="love()">💖 Tap if you love me</button>
</div>

<script>
function popper(){
  document.getElementById("surprise").style.display="block";
  for(let i=0;i<25;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},100%,60%)`;
    c.style.animationDuration=2+Math.random()*2+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}

function love(){
  alert("I love you more 😘 Happy Birthday!");
}
</script>

</body>
</html>
